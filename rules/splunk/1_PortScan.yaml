name: Port Scan Detected (Firewall Blocks)
description: Bir mənbə IP-nin qısa müddətdə çoxlu fərqli portlara bloklanmış qoşulma cəhdi
mitre: "TA0043 / T1046"
severity: 4
cron: "*/10 * * * *"
earliest: "-15m"
throttle_period: "1h"
throttle_fields: "src_ip"
false_positives:
  - Vulnerability scanner və monitorinq sistemləri
  - Səhv konfiqurasiya olunmuş tətbiq
test: "nmap -p 1-100 <hədəf_IP> komandası"
search: |
  index=network_security sourcetype=linux_messages_syslog filterlog
  | rex "filterlog\[\d+\]:\s*(?<rule>\d+),[^,]*,[^,]*,(?<tracker>\d+),(?<iface>[^,]+),[^,]*,(?<action>[^,]+),(?<dir>[^,]+),4,(?:[^,]*,){7}(?<proto>[^,]+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dest_ip>[\d\.]+)(?:,(?<src_port>\d+),(?<dest_port>\d+))?"
  | where action="block" AND isnotnull(dest_port)
  | stats dc(dest_port) as ports, dc(dest_ip) as targets, count by src_ip
  | where ports>=20
  

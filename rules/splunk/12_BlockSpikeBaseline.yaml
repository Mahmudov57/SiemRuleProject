name: Firewall Block Spike Above Baseline
description: Mənbə IP-nin son 15 dəqiqəlik bloklanma sayı öz 24 saatlıq normasından 3 standart sapma yuxarıdır
mitre: "TA0043 / T1595"
sigma_ref: "Firewall anomaly / volume baseline ideyası əsasında uyğunlaşdırılıb"
severity: 3
cron: "*/15 * * * *"
earliest: "-24h"
throttle_period: "1h"
throttle_fields: "src_ip"
false_positives:
  - Yeni quraşdırılmış servis (baseline hələ formalaşmayıb)
  - Planlı scan və backup pəncərələri
test: "nmap -T5 -p 1-1000 <hədəf> ilə qısa müddətdə yüzlərlə bloklanan paket yarat"
search: |
  index=network_security sourcetype=linux_messages_syslog filterlog
  | rex "filterlog\[\d+\]:\s*(?<rule>\d+),[^,]*,[^,]*,(?<tracker>\d+),(?<iface>[^,]+),[^,]*,(?<action>[^,]+),(?<dir>[^,]+),4,(?:[^,]*,){7}(?<proto>[^,]+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dest_ip>[\d\.]+)(?:,(?<src_port>\d+),(?<dest_port>\d+))?"
  | where action="block" AND NOT dest_port IN (123,53,67,68)
  | bin _time span=15m
  | stats count by _time, src_ip
  | eventstats avg(count) as avg_c, stdev(count) as sd by src_ip
  | where _time>=relative_time(now(),"-30m") AND count>avg_c+3*sd AND count>=50

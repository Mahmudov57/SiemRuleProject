name: Brute Force Followed by Successful Logon
description: Eyni mənbə IP-dən çoxlu uğursuz girişdən sonra uğurlu giriş (ehtimal olunan parol tapılması)
mitre: "TA0006 / T1110.001"
severity: 5
cron: "*/10 * * * *"
earliest: "-30m"
throttle_period: "1h"
throttle_fields: "src_ip"
false_positives:
  - İstifadəçinin parolunu çox səhv yazması
  - Vulnerability scanner və monitorinq hesabları
  - Servis hesablarının köhnə parolla təkrar cəhdləri
test: "Bir hesaba 10+ səhv parol ilə RDP/SMB girişi, sonra düzgün parol"
search: |
  index=* sourcetype="WinEventLog:Security" (EventCode=4625 OR EventCode=4624)
  | rename Source_Network_Address as src_ip
  | where isnotnull(src_ip) AND src_ip!="-" AND NOT cidrmatch("127.0.0.0/8", src_ip) AND NOT cidrmatch("::1/128", src_ip)
  | stats count(eval(EventCode=4625)) as failures,
          count(eval(EventCode=4624)) as successes,
          dc(user) as targeted_users,
          earliest(_time) as first_seen, latest(_time) as last_seen by src_ip
  | where failures>=10 AND successes>=1
  | eval first_seen=strftime(first_seen,"%F %T"), last_seen=strftime(last_seen,"%F %T")

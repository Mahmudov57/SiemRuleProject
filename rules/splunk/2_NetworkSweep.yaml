name: Network Sweep Detected (Firewall Blocks)
description: Bir mənbə IP eyni portu çoxlu fərqli hostlarda yoxlayır
mitre: "TA0007 / T1018"
severity: 4
cron: "*/10 * * * *"
earliest: "-15m"
throttle_period: "1h"
throttle_fields: "src_ip"
false_positives:
  - Şəbəkə inventar və discovery alətləri
  - DHCP/NTP kimi qanuni yayım trafiki
test: "nmap -p 445 10.10.20.0/24"
search: |
  index=network_security sourcetype=linux_messages_syslog filterlog
  | rex "filterlog\[\d+\]:\s*(?<rule>\d+),[^,]*,[^,]*,(?<tracker>\d+),(?<iface>[^,]+),[^,]*,(?<action>[^,]+),(?<dir>[^,]+),4,(?:[^,]*,){7}(?<proto>[^,]+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dest_ip>[\d\.]+)(?:,(?<src_port>\d+),(?<dest_port>\d+))?"
  | where action="block" AND isnotnull(dest_port) AND NOT cidrmatch("224.0.0.0/4", dest_ip) AND dest_ip!="255.255.255.255"
  | stats dc(dest_ip) as targets, count by src_ip, dest_port
  | where targets>=15

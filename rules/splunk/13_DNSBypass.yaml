name: Outbound DNS to External Resolver Blocked
description: Daxili host təsdiqlənməmiş xarici DNS serverinə sorğu göndərir (DNS tunneling və ya bypass ehtimalı)
mitre: "TA0011 / T1071.004"
sigma_ref: "DNS / firewall egress anomaly ideyası əsasında uyğunlaşdırılıb"
severity: 3
cron: "*/15 * * * *"
earliest: "-30m"
throttle_period: "2h"
throttle_fields: "src_ip"
false_positives:
  - Əl ilə 8.8.8.8 və ya 1.1.1.1 konfiqurasiya olunmuş cihazlar
  - Brauzer DoH/DoT fallback-ı
test: "nslookup example.com 9.9.9.9 komandasını bir neçə dəfə işlət"
search: |
  index=network_security sourcetype=linux_messages_syslog filterlog
  | rex "filterlog\[\d+\]:\s*(?<rule>\d+),[^,]*,[^,]*,(?<tracker>\d+),(?<iface>[^,]+),[^,]*,(?<action>[^,]+),(?<dir>[^,]+),4,(?:[^,]*,){7}(?<proto>[^,]+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dest_ip>[\d\.]+)(?:,(?<src_port>\d+),(?<dest_port>\d+))?"
  | where action="block" AND dest_port=53 AND cidrmatch("10.0.0.0/8", src_ip) AND NOT cidrmatch("10.0.0.0/8", dest_ip)
  | stats count, dc(dest_ip) as resolvers, values(dest_ip) as dest_ips by src_ip
  | where count>=10

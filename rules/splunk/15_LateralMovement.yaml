name: Internal Lateral Movement Attempts on Admin Ports
description: Daxili host başqa şəbəkə seqmentindəki hostlara SSH, RPC, SMB, RDP və WinRM portlarında bloklanmış cəhdlər göndərir
mitre: "TA0008 / T1021"
sigma_ref: "Lateral movement / remote services kateqoriyası əsasında uyğunlaşdırılıb"
severity: 5
cron: "*/10 * * * *"
earliest: "-30m"
throttle_period: "2h"
throttle_fields: "src_ip"
false_positives:
  - İT idarəetmə serverləri və patch/inventory alətləri
  - Planlı admin əlçatanlığı (allowlist ilə exclusion)
test: "Bir VLAN-dakı hostdan digər VLAN-a nmap -p 22,135,445,3389,5985 <hədəf>"
search: |
  index=network_security sourcetype=linux_messages_syslog filterlog
  | rex "filterlog\[\d+\]:\s*(?<rule>\d+),[^,]*,[^,]*,(?<tracker>\d+),(?<iface>[^,]+),[^,]*,(?<action>[^,]+),(?<dir>[^,]+),4,(?:[^,]*,){7}(?<proto>[^,]+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dest_ip>[\d\.]+)(?:,(?<src_port>\d+),(?<dest_port>\d+))?"
  | where action="block" AND dest_port IN (22,135,445,3389,5985,5986)
  | where cidrmatch("10.0.0.0/8",src_ip) AND cidrmatch("10.0.0.0/8",dest_ip)
  | eval src_net=replace(src_ip,"\.\d+$",""), dest_net=replace(dest_ip,"\.\d+$","")
  | where src_net!=dest_net
  | stats count, dc(dest_ip) as targets, values(dest_port) as ports, values(dest_net) as dest_nets by src_ip
  | where count>=3 AND targets>=2
